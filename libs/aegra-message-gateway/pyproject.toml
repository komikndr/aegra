[project]
name = "aegra-message-gateway"
version = "0.1.0"
description = "Telegram and WhatsApp messaging gateway for Aegra"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "asyncpg>=0.30.0",
    "cryptography>=49.0.0",
    "fastapi>=0.110.1",
    "httpx>=0.28.1",
    "pillow>=11.0.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.14.2",
    "python-telegram-bot==22.6",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
aegra-message-gateway = "aegra_message_gateway.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegra_message_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.13.0",
    "ty>=0.0.17,<0.1.0",
]
