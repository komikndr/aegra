name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Check formatting with ruff
        run: uvx ruff format --check .

      - name: Lint with ruff
        run: uvx ruff check .

  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace dependencies
        run: uv sync --all-packages

      - name: Type check with ty
        run: uv run ty check libs/aegra-api/src/ libs/aegra-cli/src/
        continue-on-error: true

      - name: Security check with bandit
        run: uv run bandit -c pyproject.toml -r libs/aegra-api/src/
        continue-on-error: true

      - name: Check OpenAPI schema drift
        run: uv run --package aegra-api python scripts/export_openapi.py --check

      - name: Run tests with pytest
        env:
          AEGRA_CONFIG: ""
          POSTGRES_USER: "user"
          POSTGRES_PASSWORD: "password"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: "5432"
          POSTGRES_DB: "aegra"
        run: uv run --package aegra-api pytest libs/aegra-api/tests/unit libs/aegra-api/tests/integration --cov=libs/aegra-api/src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: aegra-api
          name: aegra-api
          fail_ci_if_error: false

  test-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace dependencies
        run: uv sync --all-packages

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/echarts-renderer/package-lock.json

      - name: Run tests with pytest
        run: uv run --package aegra-cli pytest libs/aegra-cli/tests/ --cov=libs/aegra-cli/src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: aegra-cli
          name: aegra-cli
          fail_ci_if_error: false

  test-message-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: aegra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d aegra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace dependencies
        run: uv sync --all-packages

      - name: Apply database migrations
        working-directory: libs/aegra-api
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: aegra
        run: uv run alembic upgrade head

      - name: Type check gateway
        run: uv run ty check libs/aegra-message-gateway/src libs/aegra-message-gateway/tests

      - name: Test gateway
        env:
          MESSAGE_GATEWAY_TEST_DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/aegra
        run: uv run --package aegra-message-gateway pytest libs/aegra-message-gateway/tests

      - name: Test ECharts renderer
        working-directory: services/echarts-renderer
        run: npm ci && npm test

      - name: Validate messaging Compose configuration
        env:
          MESSAGE_GATEWAY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          MESSAGE_GATEWAY_HMAC_KEY: MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE=
          TELEGRAM_BOT_TOKEN: test-token
          TELEGRAM_ALLOWED_USERS: "42"
        run: cp .env.example .env && docker compose -f docker-compose.yml -f docker-compose.messaging.yml --profile messaging config

      - name: Build gateway image
        run: docker build -f deployments/docker/Dockerfile.message-gateway -t aegra-message-gateway:ci .

      - name: Build ECharts renderer image
        run: docker build -t aegra-echarts-renderer:ci services/echarts-renderer
