---
- name: Inspect the existing ONYX staging deployment
  hosts: onyx_staging
  gather_facts: false
  tasks:
    - name: Inspect Compose configuration and existing containers without exposing secrets
      ansible.builtin.script:
        cmd: >-
          inspect_stack.py
          --backend {{ onyx_backend_dir | quote }}
          --frontend {{ onyx_frontend_dir | quote }}
          --secrets {{ onyx_secret_dir | quote }}
        executable: "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      register: onyx_inspection
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Decode the sanitized inspection result
      block:
        - name: Read inspection JSON without exposing transport output
          ansible.builtin.set_fact:
            onyx_preflight_report: "{{ onyx_inspection.stdout | from_json }}"
          no_log: true
      rescue:
        - name: Report an inspection transport or interpreter failure
          ansible.builtin.fail:
            msg: Preflight could not return JSON. Check the configured remote Python interpreter and SSH access.

    - name: Report a sanitized inspection failure
      ansible.builtin.fail:
        msg: "{{ onyx_preflight_report.error | default('Preflight failed before inspection completed.') }}"
      when: onyx_inspection.rc | default(1) != 0 or onyx_preflight_report.error is defined

    - name: Show the sanitized deployment report
      ansible.builtin.debug:
        msg: "{{ onyx_preflight_report }}"
